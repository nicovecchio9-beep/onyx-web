<style>
  :root { --ink:#111; --mut:#666; --lt:#999; --line:#eee; --bg:#fff; --soft:#f5f4f0; --wa:#25D366; --ok:#1a8f3c; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .wrap { max-width:560px; margin:0 auto; padding:0 20px 150px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:18px 0 0; }
  header img { width:48px; height:48px; border-radius:12px; display:block; }
  .marca { display:flex; align-items:center; gap:10px; }
  .marca div { display:flex; flex-direction:column; line-height:1.05; }
  .marca b { font-size:15px; font-weight:900; letter-spacing:4px; }
  .marca span { font-size:11px; color:var(--mut); }
  h1 { font-size:40px; }
  .fld { display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .fld label { font-size:11px; font-weight:700; letter-spacing:1.5px; color:var(--mut); text-transform:uppercase; }
  .fld select, .fld input, .fld textarea { font:inherit; font-size:15px; padding:12px 14px; border:1px solid #ddd; border-radius:12px; background:#fff; color:var(--ink); width:100%; }
  .fld textarea { min-height:80px; resize:vertical; }
  .opt { display:flex; gap:8px; }
  .opt label { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border:1px solid #ddd; border-radius:12px; font-size:14px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--ink); cursor:pointer; }
  .opt input { width:auto; }
  .opt label.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .tj { display:inline-flex; align-items:center; gap:6px; }
  .tj i { width:22px; height:14px; border-radius:3px; display:inline-block; }
  .live { font-size:11px; font-weight:600; color:var(--ok); display:flex; align-items:center; gap:6px; }
  .live i { width:8px; height:8px; border-radius:50%; background:var(--ok); display:inline-block; animation:p 1.2s infinite alternate; }
  @keyframes p { to { opacity:.25 } }
  h1 { margin:22px 0 0; font-size:44px; font-weight:900; line-height:.95; letter-spacing:-2px; }
  .sub { margin:10px 0 0; font-size:13px; color:var(--mut); }
  nav.tabs { display:flex; gap:0; margin-top:18px; border-bottom:2px solid var(--ink); overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar { display:none; }
  .tab { padding:10px 14px; font-size:14px; color:#888; white-space:nowrap; margin-bottom:-2px; border-bottom:3px solid transparent; }
  .tab:first-child { padding-left:0; }
  .tab.on { color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
  .seguro { margin-top:14px; width:100%; display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:12px; background:var(--ink); color:#fff; text-align:left; }
  .seguro small { display:block; font-size:10px; letter-spacing:2px; font-weight:700; color:#9ccc65; }
  .seguro b { display:block; font-size:14px; margin-top:2px; }
  .seguro span { display:block; font-size:11px; color:#bbb; margin-top:2px; }
  .nota { margin-top:14px; font-size:12px; color:var(--mut); line-height:1.5; }
  .nota span + span::before { content:" · "; }
  .chips { display:flex; gap:6px; margin-top:12px; overflow-x:auto; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { padding:7px 12px; border-radius:8px; border:1px solid #ddd; font-size:12px; color:var(--mut); white-space:nowrap; }
  .chip.on { border-color:var(--ink); color:var(--ink); font-weight:600; }
  .sec { padding:20px 0 6px; font-size:11px; font-weight:700; letter-spacing:2px; color:var(--lt); text-transform:uppercase; }
  .it { width:100%; display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); text-align:left; }

    if (x.cat === 'usados') return '<span><i class="dot" style="background:' + colorHex(x.color) + '"></i>' + esc(x.color) + ' · ' + esc(x.bat) + (x.grado ? ' · ' + esc(x.grado) : '') + '</span>';
    var cols = String(x.colores || '').split(/\s+-\s+|,|\//).map(function (c) { return c.trim(); }).filter(Boolean);
    return '<span>' + (cols.length ? cols.map(function (c) { return '<i class="dot" style="background:' + colorHex(c) + '"></i>' + esc(titleCase(c)); }).join('&nbsp;&nbsp;') : 'Nuevo') + '</span>';
  }
  function fila(x) {
    return '<button class="it" data-id="' + esc(x.id) + '">' +
      '<span class="ph">' + (x.foto ? '<img src="' + esc(x.foto.replace('sz=w1200', 'sz=w200')) + '" loading="lazy" alt="">' : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3.5"/></svg>') + '</span>' +
      '<span class="tx">' + nombre(x) + linea2(x) + '</span>' +
      '<span class="pr">' + (x.usd ? '<b><small>US$</small>' + fmt(x.usd) + '</b>' + (D.dolar ? '<span>$ ' + fmt(pesos(x.usd)) + '</span>' : '') : '<span class="cons">Consultar</span>') + '</span>' +
    '</button>';
  }
  function grupo(items, key, label) {
    var out = '', last = null;
    items.forEach(function (x) { var k = key(x); if (k !== last) { out += '<div class="sec">' + esc(label(k)) + '</div>'; last = k; } out += fila(x); });
    return out;
  }
  function pintar() {
    var vis = CATS.filter(function (c) { return delCat(c.id).length; });
    if (!vis.some(function (c) { return c.id === cat; }) && vis.length) cat = vis[0].id;
    var items = delCat(cat).filter(function (x) { return !linea || x.linea === linea; });
    var lineas = cat === 'usados' ? Array.from(new Set(delCat('usados').map(function (x) { return x.linea; }).filter(Boolean))).sort(function (a, b) { return a - b; }) : [];
    var h = '<h1>Lista de precios</h1>' +
      '<nav class="tabs">' + vis.map(function (c) { return '<button class="tab' + (c.id === cat ? ' on' : '') + '" data-c="' + c.id + '">' + c.nombre + '</button>'; }).join('') + '</nav>';
    if (cat === 'usados') h += '<button class="seguro" id="seguro"><span><small>COMPRÁ SEGURO</small><b>Garantía de por vida certificada</b><span>Único sitio en Argentina. Tocá para ver qué cubre.</span></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></button>';
    h += '<div class="nota">' + (NOTAS[cat] || []).map(function (t) { return '<span>' + t + '</span>'; }).join('') + '</div>';
    if (lineas.length > 1) h += '<div class="chips"><button class="chip' + (!linea ? ' on' : '') + '" data-l="">Todos</button>' + lineas.map(function (l) { return '<button class="chip' + (l === linea ? ' on' : '') + '" data-l="' + l + '">Línea ' + l + '</button>'; }).join('') + '</div>';
    if (!items.length) h += '<div class="vacio">No hay equipos en esta categoría por ahora.</div>';
    else if (cat === 'usados') h += grupo(items, function (x) { return x.linea || ''; }, function (k) { return k ? 'iPhone ' + k : 'Otros'; });
    else {
      var stock = items.filter(function (x) { return !x.encargue; }), enc = items.filter(function (x) { return x.encargue; });
      h += enc.length ? (stock.length ? '<div class="sec">Stock · entrega inmediata</div>' + stock.map(fila).join('') : '') + '<div class="sec">Por encargue</div>' + enc.map(fila).join('') : '<div class="sec">Stock</div>' + items.map(fila).join('');
    }
    h += '<div class="igual"><b>Igualamos cualquier oferta.</b><p>Si lo viste más barato, mostranos y te lo igualamos.</p><small>* Siempre que cumpla con las mismas condiciones de venta: mismo modelo, estado, batería, garantía y forma de pago.</small></div>' +
      '<button class="igual" id="canje" style="width:100%;text-align:left;margin-top:10px;background:var(--ink);color:#fff"><b>¿Tenés un canje?</b><p style="color:#bbb">Cotizalo con nosotros: tocá acá y contanos qué equipo tenés.</p></button>';
    var app = document.getElementById('app');
    app.innerHTML = h;
    document.getElementById('canje').onclick = verCanje;
    app.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { cat = b.dataset.c; linea = ''; pintar(); }; });
    app.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { linea = b.dataset.l; pintar(); }; });
    app.querySelectorAll('.it').forEach(function (b) { b.onclick = function () { abrirItem(b.dataset.id); }; });
    var sg = document.getElementById('seguro'); if (sg) sg.onclick = abrirGarantia;
    document.getElementById('foot').style.display = '';
    document.getElementById('fix').style.display = '';
    if (D.act) document.getElementById('live').innerHTML = '<i></i>Precios al día · ' + esc(D.act.split(' ').pop());
  }

  // ---------- Hojas ----------
  var ov = document.getElementById('ov'), sh = document.getElementById('sh');
  function abrir(html) { sh.innerHTML = '<div class="bar"></div>' + html; ov.classList.add('on'); sh.scrollTop = 0; sh.querySelectorAll('.cer').forEach(function (b) { b.onclick = cerrar; }); }
  function cerrar() { ov.classList.remove('on'); }
  ov.onclick = function (e) { if (e.target === ov) cerrar(); };
  function abrirItem(id) {
    var x = D.items.filter(function (i) { return i.id === id; })[0]; if (!x) return;
    var h = '<h3>' + esc(titulo(x).replace(/ de batería$/, '')) + '</h3>';
    if (x.foto) h += '<img class="foto" src="' + esc(x.foto) + '" alt="">';
    if (x.usd) {
      h += '<div class="card" style="display:flex;justify-content:space-between;align-items:baseline"><span><b style="font-size:24px;font-weight:900">US$ ' + fmt(x.usd) + '</b><br><span style="color:#777">en efectivo</span></span>' + (D.dolar ? '<span style="text-align:right"><b style="font-size:16px;font-weight:800">$ ' + fmt(pesos(x.usd)) + '</b><br><span style="color:#777">efectivo o transferencia</span></span>' : '') + '</div>';
      if (hayCuotas()) {
        var base = pesos(x.usd);
        h += '<div class="card"><b class="t">FINANCIACIÓN CON TARJETA DE CRÉDITO</b><div class="tjs" style="flex-wrap:wrap"><span class="tj"><i style="background:#1A1F71"></i>Visa</span><span class="tj"><i style="background:linear-gradient(90deg,#EB001B 50%,#F79E1B 50%)"></i>Mastercard</span><span class="tj"><i style="background:#2E77BC"></i>American Express</span><span class="tj"><i style="background:#FE5000"></i>Naranja</span></div>' +
          planes().map(function (n) { var c = Math.ceil(base * (1 + Number(D.cuotas[n]) / 100) / n / 100) * 100; return '<div class="cuota"><span>' + n + ' cuotas de</span><b>$ ' + fmt(c) + '</b></div>'; }).join('') + '</div>';
      }
      h += '<a class="btn wa" target="_blank" rel="noopener" href="' + waLink(mensaje(x)) + '">Pedir por WhatsApp</a>';
    } else {
      h += '<a class="btn wa" target="_blank" rel="noopener" href="' + waLink(mensaje(x)) + '">Consultar precio por WhatsApp</a>';
    }
    h += '<button class="btn out cer">Cerrar</button>';
    abrir(h);
  }
  function abrirGarantia() {
    abrir('<span class="k">COMPRÁ SEGURO</span><h3>Garantía de por vida certificada</h3>' +
      '<div class="card dark"><b>El único sitio en Argentina</b> con garantía de por vida certificada en iPhone usados. Te llevás el equipo con un certificado a tu nombre, con modelo, GB, color, batería e IMEI.</div>' +
      '<div class="cols2"><div class="card"><b class="t" style="color:var(--ok)">✓ CUBRE</b>Fallas de funcionamiento<br>Fallas de software<br>Revisión en nuestro servicio técnico</div>' +
      '<div class="card"><b class="t" style="color:#b3261e">✕ NO CUBRE</b>Golpes y caídas<br>Agua o líquidos<br>Reparaciones en otros servicios</div></div>' +
      '<div class="card"><b class="t">INCLUYE CON TU USADO PREMIUM</b>Cargador · Cable · Funda · Templado 🎁<br><span style="color:#888;font-size:10px">Vale para el comprador original mientras tenga el equipo. Cada reclamo pasa por revisión previa de nuestro servicio técnico.</span></div>' +
      '<button class="btn k cer">Entendido, ver equipos</button>');
  }
  function verNos() {
    document.getElementById('app').innerHTML = '<div class="nos"><button class="btn out" id="volver" style="width:auto;padding:0 16px;height:40px;margin-top:14px">← Volver al stock</button>' +
      '<h2>Quiénes somos</h2>' +
      '<p>Somos ONYX, una tienda de productos Apple en Rosario. Vendemos iPhone nuevos y usados premium, MacBook, iPad, Apple Watch y AirPods, y te atendemos de forma personalizada por WhatsApp.</p>' +
      '<ul><li>Equipos nuevos con 1 año de garantía Apple oficial.</li><li>Usados premium con garantía de por vida certificada.</li><li>Los iPhone incluyen funda, cargador y templado de regalo.</li><li>Pagás en efectivo en dólares o pesos, o con tarjeta de crédito en cuotas.</li></ul>' +
      '<p>Nuestra oficina está en Puerto Norte, Av. Carballo 186, Rosario.</p></div>';
    document.getElementById('volver').onclick = function () { pintar(); window.scrollTo(0, 0); };
    document.getElementById('fix').style.display = 'none';
    window.scrollTo(0, 0);
  }
  document.getElementById('nosLink').onclick = function (e) { e.preventDefault(); verNos(); };
  function verCanje() {
    var opt = function (a, ph) { return '<option value="">' + ph + '</option>' + a.map(function (v) { return '<option>' + v + '</option>'; }).join(''); };
    document.getElementById('app').innerHTML = '<div class="nos"><button class="btn out" id="volver" style="width:auto;padding:0 16px;height:40px;margin-top:14px">← Volver al stock</button>' +
      '<h2>Cotizá tu canje</h2><p>Contanos qué equipo tenés y te decimos cuánto te lo tomamos.</p>' +
      '<div class="fld"><label>Tu iPhone</label><select id="cModelo">' + opt(CANJE.map(function (c) { return c[0]; }), 'Elegí el modelo') + '</select></div>' +
      '<div class="fld"><label>Memoria</label><select id="cGb" disabled><option value="">Primero elegí el modelo</option></select></div>' +
      '<div class="fld"><label>Batería</label><input id="cBat" inputmode="numeric" placeholder="Ej: 87 (salud de la batería en %)"></div>' +
      '<div class="fld"><label>¿Tiene detalles?</label><div class="opt"><label id="dNo" class="on"><input type="radio" name="det" value="no" checked style="display:none">No, está impecable</label><label id="dSi"><input type="radio" name="det" value="si" style="display:none">Sí, tiene detalles</label></div></div>' +
      '<div class="fld" id="fDet" style="display:none"><label>¿Qué detalles tiene?</label><textarea id="cDet" placeholder="Ej: rayón en la pantalla, marca en el borde…"></textarea></div>' +
      '<div class="fld"><label>¿Qué equipo te interesa?</label><input id="cQuiero" placeholder="Ej: iPhone 16 Pro 256 GB"></div>' +
      '<a class="btn wa" id="cWa" target="_blank" rel="noopener" href="#" style="margin-top:18px">Cotizar por WhatsApp</a>' +
      '<p style="font-size:11px;color:#999;margin-top:8px">Se abre WhatsApp con el pedido completo; vos solo lo mandás.</p></div>';
    var g = function (id) { return document.getElementById(id); };
    var det = 'no';
    var pick = function (v) { det = v; g('dNo').classList.toggle('on', v === 'no'); g('dSi').classList.toggle('on', v === 'si'); g('fDet').style.display = v === 'si' ? '' : 'none'; };
    g('dNo').onclick = function () { pick('no'); }; g('dSi').onclick = function () { pick('si'); };
    g('cModelo').onchange = function () {
      var c = CANJE.filter(function (x) { return x[0] === g('cModelo').value; })[0];
      g('cGb').disabled = !c;
      g('cGb').innerHTML = c ? opt(c[1].map(gbTxt), 'Elegí la memoria') : '<option value="">Primero elegí el modelo</option>';
    };
    g('cWa').onclick = function (e) {
      var m = g('cModelo').value, gb = g('cGb').value, bat = g('cBat').value.trim(), q = g('cQuiero').value.trim(), d = g('cDet').value.trim();
      if (!m || !gb) { e.preventDefault(); alert('Elegí el modelo y la memoria de tu iPhone.'); return; }
      var t = 'Hola Nico, quisiera cotizar este canje.\n\n📱 Mi equipo: iPhone ' + m + ' ' + gb + (bat ? ' · batería ' + bat.replace('%', '') + '%' : '') +
        '\n🔎 Detalles: ' + (det === 'si' ? (d || 'sí, tiene detalles') : 'no, está impecable') +
        (q ? '\n🎯 Me interesa: ' + q : '');
      this.href = waLink(t);
    };
    g('volver').onclick = function () { pintar(); window.scrollTo(0, 0); };
    document.getElementById('fix').style.display = 'none';
    window.scrollTo(0, 0);
  }
  document.getElementById('waNico').href = waLink('Hola Nico, ¿cómo estás? No encontré lo que busco en la web, ¿me lo conseguís?');

  // ---------- Datos ----------
  function cargar(primera) {
    return fetch(API, { method: 'POST', body: JSON.stringify({ fn: 'getDatos', args: [] }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.error || !j.ok || !j.ok.items) throw new Error(j.error || 'datos'); D = j.ok; if (primera || !ov.classList.contains('on')) { if (!document.querySelector('.nos')) pintar(); } })
      .catch(function () {
        if (D) return;
        document.getElementById('app').innerHTML = '<div class="err">No pudimos cargar el stock en este momento.<br><br><button class="btn out" onclick="location.reload()">Reintentar</button>' +
          '<a class="btn wa" target="_blank" rel="noopener" href="' + waLink('Hola! Vengo de la web de ONYX.') + '">Escribinos por WhatsApp</a></div>';
      });
  }
  cargar(true).then(function () { if (D && qs.get('p') === 'nosotros') verNos(); });
  setInterval(function () { cargar(false); }, 120000);
})();
</script>
</body>
</html>
